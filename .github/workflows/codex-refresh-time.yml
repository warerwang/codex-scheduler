name: Codex Rate Limit Check

on:
  workflow_dispatch:

jobs:
  check-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex and parse rate limits
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON_1 }}
          TZ: Asia/Taipei
        run: |
          set -Eeuo pipefail

          export CODEX_HOME="$HOME/.codex"

          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"

          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"

          cat > "$CODEX_HOME/config.toml" <<'EOF'
          model = "gpt-5.4-mini"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"
          EOF

          mkdir -p /tmp/codex-rate-limit-check
          cd /tmp/codex-rate-limit-check

          codex exec \
            --model gpt-5.4-mini \
            --skip-git-repo-check \
            --sandbox danger-full-access \
            "Reply exactly: OK"

          echo
          echo "===== CODEX_HOME files ====="
          find "$CODEX_HOME" -maxdepth 4 -type f | sort || true

          echo
          echo "===== Find latest Codex session ====="

          if [ ! -d "$CODEX_HOME/sessions" ]; then
            echo "No sessions directory found: $CODEX_HOME/sessions"
            echo "Try checking CODEX_HOME content above."
            exit 1
          fi

          latest="$(find "$CODEX_HOME/sessions" -name '*.jsonl' -print0 | xargs -0 ls -t | head -1)"

          if [ -z "$latest" ]; then
            echo "No jsonl session file found."
            exit 1
          fi

          echo "latest session: $latest"

          echo
          echo "===== Codex rate limits ====="

          jq -r '
            select(
              .type == "event_msg"
              and .payload.type == "token_count"
              and .payload.rate_limits
            )
            | .payload.rate_limits
            | [
                "limit: " + ((.limit_name // .limit_id // "unknown") | tostring),
                "5h used: " + ((.primary.used_percent // 0) | tostring) + "%",
                "5h reset: " + ((.primary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z")),
                "week used: " + ((.secondary.used_percent // 0) | tostring) + "%",
                "week reset: " + ((.secondary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z"))
              ]
            | .[]
          ' "$latest" | tail -n 5

          echo
          echo "===== Debug latest token_count events ====="
          jq -c '
            select(.type=="event_msg" and .payload.type=="token_count")
            | .payload
          ' "$latest" | tail -n 3 || true
