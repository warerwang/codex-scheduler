name: Codex Rate Limit Check

on:
  workflow_dispatch:

jobs:
  check-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex and parse rate limits
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON_1 }}
          TZ: Asia/Taipei
        run: |
          set -Eeuo pipefail

          rm -rf ~/.codex
          mkdir -p ~/.codex
          chmod 700 ~/.codex

          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

          cat > ~/.codex/config.toml <<'EOF'
          model = "gpt-5.4-mini"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"
          EOF

          mkdir -p /tmp/codex-rate-limit-check
          cd /tmp/codex-rate-limit-check

          codex exec \
            --model gpt-5.4-mini \
            --skip-git-repo-check \
            --sandbox danger-full-access \
            --ephemeral \
            "1+1=几?"

          echo
          echo "===== Find latest Codex session ====="

          latest="$(find ~/.codex/sessions -name '*.jsonl' -print0 | xargs -0 ls -t | head -1)"

          echo "latest session: $latest"

          echo
          echo "===== Codex rate limits ====="

          jq -r '
            select(
              .type == "event_msg"
              and .payload.type == "token_count"
              and .payload.rate_limits
            )
            | .payload.rate_limits
            | [
                "limit: " + ((.limit_name // .limit_id // "unknown") | tostring),
                "5h used: " + ((.primary.used_percent // 0) | tostring) + "%",
                "5h reset: " + ((.primary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z")),
                "week used: " + ((.secondary.used_percent // 0) | tostring) + "%",
                "week reset: " + ((.secondary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z"))
              ]
            | .[]
          ' "$latest" | tail -n 5
