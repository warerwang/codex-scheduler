name: Codex Usage Check

on:
  workflow_dispatch:

jobs:
  check-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Check Codex account 1 usage
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON_1 }}
          TERM: xterm-256color
        run: |
          rm -rf ~/.codex
          mkdir -p ~/.codex
          chmod 700 ~/.codex

          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

          cat > ~/.codex/config.toml <<'EOF'
          model = "gpt-5.4-mini"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"
          EOF

          mkdir -p /tmp/codex-usage-1
          cd /tmp/codex-usage-1

          echo "===== Account 1 /status ====="
          timeout 45s script -q -e -c 'codex --no-alt-screen --skip-git-repo-check --sandbox danger-full-access' /tmp/codex-status-1.log <<'EOF' || true
          /status
          EOF

          echo "===== Account 1 /usage daily ====="
          timeout 45s script -q -e -c 'codex --no-alt-screen --skip-git-repo-check --sandbox danger-full-access' /tmp/codex-usage-daily-1.log <<'EOF' || true
          /usage daily
          EOF

          echo "===== Saved logs ====="
          ls -lah /tmp/codex-status-1.log /tmp/codex-usage-daily-1.log || true

      - name: Upload Codex usage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-logs
          path: |
            /tmp/codex-status-1.log
            /tmp/codex-usage-daily-1.log
