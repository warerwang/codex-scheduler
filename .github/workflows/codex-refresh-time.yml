name: Codex Rate Limit Prime

on:
  schedule:
    - cron: "55 5 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "0 11 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "5 16 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:

concurrency:
  group: codex-rate-limit-prime
  cancel-in-progress: false

jobs:
  prime-codex-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install latest Codex CLI
        run: npm install -g @openai/codex

      - name: Verify repository secret write access
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing GH_SECRET_WRITE_TOKEN."
            exit 1
          fi
          printf 'ok' | gh secret set CODEX_SECRET_WRITE_CHECK --repo "$GITHUB_REPOSITORY"

      - name: Prime Codex accounts and persist refreshed auth
        env:
          CODEX_AUTH_JSON_1: ${{ secrets.CODEX_AUTH_JSON_1 }}
          CODEX_AUTH_JSON_2: ${{ secrets.CODEX_AUTH_JSON_2 }}
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          TZ: Asia/Taipei
        run: |
          set -Euo pipefail

          MODEL="gpt-5.6-luna"
          ENDPOINT="https://chatgpt.com/backend-api/codex/responses"
          CODEX_VERSION="$(codex --version | awk '{print $NF}' | sed 's/^v//')"
          overall_status=0

          persist_auth() {
            local secret_name="$1"
            local auth_file="$2"
            local attempt
            for attempt in 1 2 3; do
              if gh secret set "$secret_name" --repo "$GITHUB_REPOSITORY" < "$auth_file"; then
                return 0
              fi
              echo "::warning::Failed to persist refreshed auth for $secret_name (attempt $attempt/3)."
              sleep $((attempt * 2))
            done
            echo "::error::Unable to persist refreshed auth for $secret_name after 3 attempts."
            return 1
          }

          header_value() {
            local headers_file="$1"
            local header_name="$2"
            grep -i "^${header_name}:" "$headers_file" 2>/dev/null | tail -1 | cut -d: -f2- | tr -d '\r' | xargs || true
          }

          format_reset_at() {
            local epoch="$1"
            if [[ "$epoch" =~ ^[0-9]+$ ]] && [[ "$epoch" -gt 0 ]]; then
              TZ=Asia/Taipei date -d "@$epoch" '+%Y-%m-%d %H:%M:%S %Z'
            else
              echo "unknown"
            fi
          }

          show_http_result() {
            local headers_file="$1"
            local body_file="$2"
            local label="$3"
            local primary_used primary_reset secondary_used secondary_reset total_tokens

            primary_used="$(header_value "$headers_file" "x-codex-primary-used-percent")"
            primary_reset="$(header_value "$headers_file" "x-codex-primary-reset-at")"
            secondary_used="$(header_value "$headers_file" "x-codex-secondary-used-percent")"
            secondary_reset="$(header_value "$headers_file" "x-codex-secondary-reset-at")"

            total_tokens="$(sed -n 's/^data: //p' "$body_file" 2>/dev/null | jq -r 'select(.type == "response.completed") | .response.usage.total_tokens // empty' 2>/dev/null | tail -1 || true)"

            echo
            echo "===== $label lightweight HTTP result ====="
            echo "tokens used: ${total_tokens:-unavailable}"
            echo "5h used: ${primary_used:-unknown}%"
            echo "5h reset: $(format_reset_at "${primary_reset:-0}")"
            echo "week used: ${secondary_used:-unknown}%"
            echo "week reset: $(format_reset_at "${secondary_reset:-0}")"
          }

          show_codex_rate_limits() {
            local codex_home="$1"
            local label="$2"
            local latest

            latest="$(find "$codex_home/sessions" -type f -name '*.jsonl' -print0 2>/dev/null | xargs -0 -r ls -t 2>/dev/null | head -1 || true)"
            if [[ -z "$latest" ]]; then
              echo "No session rate-limit data found for $label."
              return 0
            fi

            echo
            echo "===== $label Codex fallback rate limits ====="
            jq -r '
              select(.type == "event_msg" and .payload.type == "token_count" and .payload.rate_limits)
              | .payload.rate_limits
              | [
                  "limit: " + ((.limit_name // .limit_id // "unknown") | tostring),
                  "5h used: " + ((.primary.used_percent // 0) | tostring) + "%",
                  "5h reset: " + ((.primary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z")),
                  "week used: " + ((.secondary.used_percent // 0) | tostring) + "%",
                  "week reset: " + ((.secondary.resets_at // 0) | strflocaltime("%Y-%m-%d %H:%M:%S %Z"))
                ]
              | .[]
            ' "$latest" | tail -n 5 || true
          }

          lightweight_prime() {
            local access_token="$1"
            local account_id="$2"
            local headers_file="$3"
            local body_file="$4"
            local payload_file="$5"
            local session_id http_status curl_status

            session_id="$(cat /proc/sys/kernel/random/uuid)"

            jq -n --arg model "$MODEL" '{
              model: $model,
              input: [
                {
                  type: "message",
                  role: "user",
                  content: [{type: "input_text", text: "OK"}]
                }
              ],
              tool_choice: "auto",
              parallel_tool_calls: false,
              reasoning: null,
              store: false,
              stream: true,
              include: []
            }' > "$payload_file"

            set +e
            http_status="$(curl -sS --connect-timeout 20 --max-time 120 -D "$headers_file" -o "$body_file" -w '%{http_code}' -X POST "$ENDPOINT"               -H "Authorization: Bearer $access_token"               -H "ChatGPT-Account-ID: $account_id"               -H "Content-Type: application/json"               -H "Accept: text/event-stream"               -H "OpenAI-Beta: responses=v1"               -H "originator: codex_cli_rs"               -H "version: $CODEX_VERSION"               -H "session_id: $session_id"               -H "User-Agent: codex_cli_rs/$CODEX_VERSION"               --data-binary "@$payload_file")"
            curl_status=$?
            set -e

            if [[ $curl_status -ne 0 ]]; then
              echo "::error::Lightweight HTTP request failed at transport level (curl exit $curl_status)."
              return 70
            fi

            echo "Lightweight HTTP status: $http_status"
            case "$http_status" in
              2??) return 0 ;;
              401) return 11 ;;
              *)   return 20 ;;
            esac
          }

          codex_refresh_and_prime() {
            local codex_home="$1"
            local work_dir="$2"
            local secret_name="$3"
            local label="$4"
            local before_hash after_hash codex_status

            cat > "$codex_home/config.toml" <<EOF
          model = "$MODEL"
          approval_policy = "never"
          sandbox_mode = "read-only"
          EOF
            chmod 600 "$codex_home/config.toml"

            before_hash="$(sha256sum "$codex_home/auth.json" | awk '{print $1}')"
            export CODEX_HOME="$codex_home"
            cd "$work_dir"

            echo "$label authentication requires refresh; falling back to Codex CLI."

            set +e
            codex exec --model "$MODEL" --skip-git-repo-check --sandbox read-only "Reply exactly: OK"
            codex_status=$?
            set -e

            after_hash="$(sha256sum "$codex_home/auth.json" | awk '{print $1}')"

            if [[ "$before_hash" != "$after_hash" ]]; then
              echo "$label auth.json changed; persisting refreshed credentials to $secret_name."
              if ! persist_auth "$secret_name" "$codex_home/auth.json"; then
                return 90
              fi
              echo "$label refreshed credentials persisted successfully."
            else
              echo "$label auth.json unchanged after Codex fallback."
            fi

            show_codex_rate_limits "$codex_home" "$label"

            if [[ $codex_status -ne 0 ]]; then
              echo "::error::$label Codex fallback failed with exit code $codex_status."
              return "$codex_status"
            fi

            echo "$label result: CODEX_REFRESH_PRIME_OK"
            return 0
          }

          prime_account() {
            local account_number="$1"
            local label="Account $account_number"
            local auth_var="CODEX_AUTH_JSON_${account_number}"
            local secret_name="CODEX_AUTH_JSON_${account_number}"
            local auth_json="${!auth_var:-}"
            local codex_home="$RUNNER_TEMP/codex-home-$account_number"
            local work_dir="$RUNNER_TEMP/codex-prime-account-$account_number"
            local headers_file="$RUNNER_TEMP/codex-http-headers-$account_number"
            local body_file="$RUNNER_TEMP/codex-http-body-$account_number"
            local payload_file="$RUNNER_TEMP/codex-http-payload-$account_number.json"
            local access_token account_id http_result

            echo
            echo "===== $label ====="
            echo "UTC now:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Taipei now: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"

            if [[ -z "$auth_json" ]]; then
              echo "::error::$secret_name is empty or missing."
              return 2
            fi

            rm -rf "$codex_home" "$work_dir"
            rm -f "$headers_file" "$body_file" "$payload_file"
            mkdir -p "$codex_home" "$work_dir"
            chmod 700 "$codex_home"

            printf '%s' "$auth_json" > "$codex_home/auth.json"
            chmod 600 "$codex_home/auth.json"

            access_token="$(jq -r '.tokens.access_token // .access_token // empty' "$codex_home/auth.json")"
            account_id="$(jq -r '.tokens.account_id // .account_id // .chatgpt_account_id // empty' "$codex_home/auth.json")"

            if [[ -z "$access_token" || -z "$account_id" ]]; then
              echo "$label has no usable access_token/account_id; using Codex fallback."
              codex_refresh_and_prime "$codex_home" "$work_dir" "$secret_name" "$label"
              return $?
            fi

            set +e
            lightweight_prime "$access_token" "$account_id" "$headers_file" "$body_file" "$payload_file"
            http_result=$?
            set -e

            case "$http_result" in
              0)
                show_http_result "$headers_file" "$body_file" "$label"
                echo "$label result: HTTP_PRIME_OK"
                return 0
                ;;
              11)
                echo "$label lightweight HTTP returned 401 Unauthorized."
                codex_refresh_and_prime "$codex_home" "$work_dir" "$secret_name" "$label"
                return $?
                ;;
              *)
                echo "::error::$label lightweight HTTP prime failed. Codex fallback was not used because this was not an authentication failure."
                return 1
                ;;
            esac
          }

          set +e
          prime_account 1
          status_1=$?
          prime_account 2
          status_2=$?
          set -e

          [[ $status_1 -ne 0 ]] && overall_status=1
          [[ $status_2 -ne 0 ]] && overall_status=1

          echo
          echo "===== Summary ====="
          echo "Account 1 status: $status_1"
          echo "Account 2 status: $status_2"

          exit "$overall_status"
