name: Codex Refresh Time

on:
  schedule:
    # UTC 周日到周四 23:00
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: codex-refresh-time
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex account 1
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON_1 }}
        run: |
          rm -rf ~/.codex
          mkdir -p ~/.codex
          chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

          mkdir -p /tmp/codex-refresh-1
          cd /tmp/codex-refresh-1

          codex exec \
            --skip-git-repo-check \
            --sandbox read-only \
            --ephemeral \
            "Run date -u only. Do not inspect any repository. Do not edit files. Reply with the UTC time only."

      - name: Run Codex account 2
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON_2 }}
        run: |
          rm -rf ~/.codex
          mkdir -p ~/.codex
          chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

          mkdir -p /tmp/codex-refresh-2
          cd /tmp/codex-refresh-2

          codex exec \
            --skip-git-repo-check \
            --sandbox read-only \
            --ephemeral \
            "Run date -u only. Do not inspect any repository. Do not edit files. Reply with the UTC time only."
